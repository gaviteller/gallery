<h2>Edit Profile — updated</h2>
<p class="subtitle">Commission status simplified to open / closed</p>

<div class="mockup" style="max-width:560px;margin:0 auto;">
  <div class="mockup-header">Edit Profile</div>
  <div class="mockup-body" style="padding:24px;display:flex;flex-direction:column;gap:20px;">

    <!-- Avatar -->
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="width:72px;height:72px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#2563eb;flex-shrink:0;">GA</div>
      <div>
        <div style="font-size:14px;font-weight:600;color:#111;">Profile photo</div>
        <div style="margin-top:6px;display:flex;gap:8px;">
          <button class="mock-button" style="font-size:12px;padding:4px 12px;">Upload photo</button>
          <button class="mock-button" style="font-size:12px;padding:4px 12px;background:#fff;color:#6b7280;border:1px solid #e5e7eb;">Remove</button>
        </div>
      </div>
    </div>

    <!-- Name -->
    <div>
      <div style="font-size:13px;font-weight:500;color:#374151;margin-bottom:6px;">Display name</div>
      <input class="mock-input" value="Gavriel" style="width:100%;box-sizing:border-box;" />
    </div>

    <!-- Bio -->
    <div>
      <div style="font-size:13px;font-weight:500;color:#374151;margin-bottom:6px;">Bio</div>
      <textarea class="mock-input" rows="3" style="width:100%;box-sizing:border-box;resize:none;" placeholder="Tell people about your work…"></textarea>
      <div style="font-size:11px;color:#9ca3af;margin-top:4px;">160 characters max</div>
    </div>

    <!-- Commission status -->
    <div>
      <div style="font-size:13px;font-weight:500;color:#374151;margin-bottom:8px;">Commissions</div>
      <div style="display:flex;gap:10px;">
        <div style="flex:1;padding:14px;border:2px solid #16a34a;border-radius:10px;background:#f0fdf4;cursor:pointer;text-align:center;">
          <div style="font-size:20px;margin-bottom:4px;">✅</div>
          <div style="font-size:13px;font-weight:600;color:#15803d;">Open</div>
          <div style="font-size:11px;color:#166534;margin-top:2px;">I'm taking commissions</div>
        </div>
        <div style="flex:1;padding:14px;border:2px solid #e5e7eb;border-radius:10px;cursor:pointer;text-align:center;">
          <div style="font-size:20px;margin-bottom:4px;">🚫</div>
          <div style="font-size:13px;font-weight:600;color:#6b7280;">Closed</div>
          <div style="font-size:11px;color:#4b5563;margin-top:2px;">Not available right now</div>
        </div>
      </div>
    </div>

    <!-- Save -->
    <button class="mock-button" style="width:100%;padding:10px;font-size:14px;">Save changes</button>
  </div>
</div>
